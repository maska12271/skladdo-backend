name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # The wrapper script loses its executable bit on a Windows-authored checkout.
      - name: Make the Maven wrapper executable
        run: chmod +x mvnw

      # The suite runs against a Postgres container started by Testcontainers (see
      # support/TestcontainersConfiguration); ubuntu-latest runners have Docker available by default.
      - name: Run tests
        run: ./mvnw -B --no-transfer-progress test

      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  deploy:
    name: Deploy
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ~/skladdo
            git -C backend pull origin master
            docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build backend
