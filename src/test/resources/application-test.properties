# Profile for @SpringBootTest runs. Activate with @ActiveProfiles("test").
#
# The datasource itself comes from Testcontainers (see support/TestcontainersConfiguration), which starts a
# disposable Postgres per test JVM run and registers its connection details automatically — nothing to set
# here. Tests run independently of whatever else is running (dev app, other test runs).

# Fresh schema per run: no migration state carried between runs. SchemaMigrations' fix-ups all find
# nothing to do against a freshly created schema.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# No scheduled jobs during tests. Chiefly this keeps the ECB exchange-rate warm-up from making an outbound
# HTTP call, which would make the suite slow and dependent on the network.
app.scheduling.enabled=false

# No demo seed. Tests build exactly the data they need through the public API, so they never depend on
# DataInitializer's fixtures changing.
app.seed.enabled=false

# Brute-force throttling off by default: tests deliberately make many failed logins in quick succession and
# would otherwise lock themselves out. The behaviour itself is covered by LoginRateLimiterTest (unit) and by
# AuthIntegrationTest.RateLimitEnabled, which switches it back on for its own context.
app.auth.rate-limit.enabled=false

# No outbound mail. Development points the platform sender at the Mailpit container from
# docker-compose.yml, and tests inherit that unless told otherwise — which would have every test that
# creates a user or an invitation open an SMTP connection, on a box (CI) where nothing is listening. Same
# reasoning as app.scheduling.enabled above: a test should not depend on a service it did not ask for.
#
# A blank host also makes PlatformMailer.isConfigured() false, so the "nothing was sent" branch is what
# the suite exercises — which is the honest default for an environment with no mail server.
app.mail.platform.smtp-host=

# Deterministic, obviously-fake secrets. Never reuse these anywhere real.
app.jwt.secret=test-only-jwt-signing-key-at-least-32-bytes-long-0123456789
app.encryption.key=test-only-encryption-key
app.mailgun.webhook-signing-key=test-only-mailgun-key

app.frontend-base-url=http://localhost:5173
app.public-base-url=http://localhost:8080
app.upload.dir=${java.io.tmpdir}/skladdo-test-uploads

# S3 storage. Only the bucket name is static; endpoint/region/credentials come from the running
# LocalStack container via @DynamicPropertySource (see support/ApiTestBase, SkladdoApplicationTests).
app.storage.s3.bucket=skladdo-test
