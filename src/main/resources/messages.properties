# User-facing error messages (English = base bundle). Resolved by GlobalExceptionHandler and
# bean validation via the request's Accept-Language header. Keep messages_et.properties and
# messages_ru.properties in parity with this file.
#
# NOTE on apostrophes: messages that take arguments ({0}, {1}, ...) are formatted with
# java.text.MessageFormat, where a single quote is an escape character. In THOSE messages a
# literal apostrophe must be doubled (''). Messages without arguments are returned verbatim.

# --- Generic HTTP-status / handler fallbacks ---------------------------------------------------
error.notFound=The item you're looking for could not be found. It may have been deleted or moved — refresh the page and try again.
error.accessDenied=You don't have permission to perform this action. Contact your administrator if you need access.
error.badRequest.generic=Your request could not be processed. Please check your input and try again.
error.server=Something went wrong on our end. Please try again in a moment — if the problem continues, contact support.
error.validation.fallback=Some of the information you entered is invalid. Please review your input and try again.
error.badRequest.malformed=We couldn't read that request. Please check the information you entered and try again.
# {0} = the unknown field name the caller asked to sort by.
error.badRequest.sortField=You can''t sort by "{0}". Please choose a different column.
# {0} = the name of the missing required parameter.
error.badRequest.missingParam=Your request is missing a required value ("{0}"). Please try again.
error.validation.tooLong=One of the values you entered is too long. Please shorten it and try again.
error.validation.required=A required value is missing. Please fill in all required fields and try again.

# --- Authentication ----------------------------------------------------------------------------
error.auth.invalidCredentials=The email or password you entered is incorrect. Please check them and try again.
error.auth.noAccount=There's no account registered with that email address.
error.auth.wrongPassword=The password you entered is incorrect. Please try again.
error.auth.passwordSetupPending=Your account isn't active yet. Check your email for a link to set your password, then sign in.
error.auth.companySuspended=Your company's account has been suspended. Please contact support.
# {0} = whole minutes remaining. MessageFormat choice keeps "1 minute" from reading "1 minutes".
error.auth.tooManyAttempts=Too many failed attempts. Please try again in {0} {0,choice,1#minute|1<minutes}.

# --- Registration ------------------------------------------------------------------------------
error.register.emailTaken=An account with that email already exists. Try signing in instead.
error.register.invalidAccountType=Choose whether this is a business account or a warehouse account.

# --- Password reset ----------------------------------------------------------------------------
error.password.tokenInvalid=This password link is invalid or has expired. Request a new one and try again.

# --- Data integrity (409 conflict) -------------------------------------------------------------
error.conflict.foreignKey=This record is still used by other data and can't be deleted. Remove or reassign the items that reference it first.
error.conflict.unique=A record with the same unique value (such as a name, code or number) already exists. Please use a different value.
error.conflict.generic=This action conflicts with existing data and could not be completed.

# --- Bean validation (constraint codes) --------------------------------------------------------
NotBlank=This field is required.
NotNull=This field is required.
NotEmpty=This field is required.
Size=This value must be between {2} and {1} characters.
Min=This value must be at least {1}.
Max=This value must be at most {1}.
Email=Please enter a valid email address.
Size.password=Password must be at least 8 characters.

# --- Shared business rules ---------------------------------------------------------------------
error.quantityPositive=Quantity must be greater than 0.
# {0} = the order-line id the caller sent. Not an apostrophe-bearing message, so no doubling needed.
error.order.unknownLine=That order line ({0}) is not part of this order. Refresh the page and try again.
error.order.itemProductOrService=Each order line must name exactly one product or service.

