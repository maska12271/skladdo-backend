# Password setup/reset email (sent to the user, translated to the caller's language).
email.passwordReset.subject=Set your Skladdo password
email.passwordReset.greeting=Hi {0},
email.passwordReset.body=Use the button below to set your password and get access to your Skladdo account.
email.passwordReset.cta=Set your password
email.passwordReset.expiry=This link expires in {0} hours.
email.passwordReset.ignore=If you weren't expecting this email, you can safely ignore it.
# Invitation: a brand-new colleague who has never had a password. Same link as the reset above, different
# thing to say - {0} is the company they have been invited into.
email.invitation.subject=You have been invited to {0} on Skladdo
email.invitation.greeting=Welcome, {0}!
email.invitation.body=You have been invited to join {0} on Skladdo. Set a password below and you are ready to start.
email.invitation.cta=Set your password
email.invitation.expiry=This invitation link expires in {0} hours.
email.invitation.ignore=If you weren't expecting this invitation, you can safely ignore this email.
# Self-service invitation: a link sent to someone with no account at all, who then fills in their own
# details. Nobody here knows their name, so the mail leads with the company - {0}.
email.userInvite.subject=You have been invited to join {0} on Skladdo
email.userInvite.greeting=Hello,
email.userInvite.body=You have been invited to join {0} on Skladdo. Follow the link below to set up your account - it only takes a minute.
email.userInvite.cta=Set up my account
email.userInvite.expiry=This invitation link expires in {0} hours and can only be used once.
email.userInvite.ignore=If you weren't expecting this invitation, you can safely ignore this email.

