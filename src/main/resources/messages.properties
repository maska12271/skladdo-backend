# User-facing error messages (English = base bundle). Resolved by GlobalExceptionHandler and
# bean validation via the request's Accept-Language header. Keep messages_et.properties and
# messages_ru.properties in parity with this file.
#
# NOTE on apostrophes: messages that take arguments ({0}, {1}, ...) are formatted with
# java.text.MessageFormat, where a single quote is an escape character. In THOSE messages a
# literal apostrophe must be doubled (''). Messages without arguments are returned verbatim.

# --- Generic HTTP-status / handler fallbacks ---------------------------------------------------
error.notFound=The item you're looking for could not be found. It may have been deleted or moved — refresh the page and try again.
error.accessDenied=You don't have permission to perform this action. Contact your administrator if you need access.
error.badRequest.generic=Your request could not be processed. Please check your input and try again.
error.server=Something went wrong on our end. Please try again in a moment — if the problem continues, contact support.
error.validation.fallback=Some of the information you entered is invalid. Please review your input and try again.

# --- Authentication ----------------------------------------------------------------------------
error.auth.invalidCredentials=The email or password you entered is incorrect. Please check them and try again.

# --- Data integrity (409 conflict) -------------------------------------------------------------
error.conflict.foreignKey=This record is still used by other data and can't be deleted. Remove or reassign the items that reference it first.
error.conflict.unique=A record with the same unique value (such as a name, code or number) already exists. Please use a different value.
error.conflict.generic=This action conflicts with existing data and could not be completed.

# --- Bean validation (constraint codes) --------------------------------------------------------
NotBlank=This field is required.
NotNull=This field is required.
NotEmpty=This field is required.
Size=This value must be between {2} and {1} characters.
Min=This value must be at least {1}.
Max=This value must be at most {1}.
Email=Please enter a valid email address.
Size.password=Password must be at least 6 characters.

# --- Shared business rules ---------------------------------------------------------------------
error.quantityPositive=Quantity must be greater than 0.

# --- Inventory ---------------------------------------------------------------------------------
error.inventory.quantityChangeNonZero=Enter a non-zero amount to adjust the stock by.
error.inventory.lotNumberRequired=A lot number is required.
error.inventory.lotNotInProduct=That lot does not belong to this product.
error.inventory.lotRemoveExceeds=You can't remove more than lot ''{0}'' holds (currently {1}).
error.inventory.noAdjustment=Enter a non-zero adjustment for at least one lot.
error.inventory.lotExists=A lot numbered ''{0}'' already exists in this warehouse. Use a different lot number.

# --- Invoice -----------------------------------------------------------------------------------
error.invoice.cancelledOrder=A cancelled order can't be invoiced. Reopen the order first.
error.invoice.activePrepaymentExists=This order already has an active prepayment invoice. Void it before generating a new one.
error.invoice.activeInvoiceExists=This order already has an active invoice. Void it before generating a new one.
error.invoice.prepaymentUnsettled=Prepayment invoice {0} must be paid or voided before the final invoice can be generated.
error.invoice.prepaymentNoValue=You can't create a prepayment invoice for an order with no value. Add items or a total first.
error.invoice.prepaymentRange=The prepayment must be greater than zero and no more than the order total.
error.invoice.voidedNoStatusChange=A voided invoice can't change its payment status.
error.invoice.useVoidEndpoint=Use the void action to void an invoice.
error.invoice.prepaymentAppliedToFinal=This prepayment is applied to a final invoice. Void the final invoice first.

# --- Stock transfer ----------------------------------------------------------------------------
error.transfer.quantityPositive=The quantity to transfer must be greater than 0.
error.transfer.warehousesRequired=Both a source and a destination warehouse are required.
error.transfer.warehousesDifferent=The source and destination warehouse must be different.
error.transfer.lotNotInSource=That lot is not stored in the source warehouse.
error.transfer.lotExceeds=You can't transfer more than lot ''{0}'' holds (currently {1}).

# --- Warehouse ---------------------------------------------------------------------------------
error.warehouse.insufficientStock=Not enough stock in warehouse ''{0}'' for product ''{1}'' (have {2}, need {3}).
error.warehouse.noAccess=You don't have access to this warehouse. Contact your administrator if you need it.

# --- User --------------------------------------------------------------------------------------
error.user.ownerCannotCreate=Owner accounts can't be created through user management.
error.user.emailExists=An account with this email already exists. Use a different email address.
error.user.ownerCannotModify=The owner account can't be modified.
error.user.cannotPromoteOwner=A user can't be promoted to owner.
error.user.passwordTooShort=Password must be at least 6 characters.
error.user.ownerCannotDelete=The owner account can't be deleted.
error.user.permissionsRestrictedRoles=Permissions can only be set for regular user and warehouse accounts.
error.user.ownerCannotArchive=The owner account can't be archived.
error.user.cannotDeleteSelf=You can't delete your own account.
error.user.cannotArchiveSelf=You can't archive your own account.
error.user.cannotUnarchiveSelf=You can't unarchive your own account.

# --- Tender ------------------------------------------------------------------------------------
error.tender.participantMismatch=That participant does not belong to this tender.

# --- File upload -------------------------------------------------------------------------------
error.upload.noFile=Please choose a file to upload.
error.upload.imageOnly=Only image files can be uploaded here.
error.upload.unsupportedType=Unsupported file type. Upload a PDF, image or office document.
