error.inventory.quantityChangeNonZero=Enter a non-zero amount to adjust the stock by.
error.inventory.lotNumberRequired=A lot number is required.
error.inventory.lotNotInProduct=That lot does not belong to this product.
error.inventory.lotRemoveExceeds=You can't remove more than lot ''{0}'' holds (currently {1}).
error.inventory.noAdjustment=Enter a non-zero adjustment for at least one lot.
error.inventory.lotExists=A lot numbered ''{0}'' already exists in this warehouse. Use a different lot number.

