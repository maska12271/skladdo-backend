# Production profile (activated by SPRING_PROFILES_ACTIVE=prod, which the Docker image sets by default).
# Every value below is supplied via environment variables on the host (Render) — no secrets live in this file.

# Postgres datasource. Render exposes host/port/db/user/password for its managed Postgres;
# compose SPRING_DATASOURCE_URL as jdbc:postgresql://HOST:PORT/DBNAME.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Keep schema auto-managed for now (same as local). Move to migrations before real production data.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# No H2 console in a Postgres deployment.
spring.h2.console.enabled=false

# Bind to the port the platform assigns (Render sets $PORT); fall back to 8080 elsewhere.
server.port=${PORT:8080}

# Secrets / deploy-specific config — must be provided by the environment.
#
# Every value here is a placeholder with NO default, deliberately: if the environment variable is
# missing, Spring fails to resolve it and the application refuses to start. A dev default would let a
# misconfigured deployment boot and run silently insecure, which is exactly the failure mode this
# pattern exists to prevent. Do not add ":fallback" to any of them.
app.jwt.secret=${APP_JWT_SECRET}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}
app.upload.dir=${APP_UPLOAD_DIR:./uploads}

# Frontend origin used to build the password setup/reset links emailed to users. Must be the
# internet-facing site origin (the recipient clicks it in their mail client).
app.frontend-base-url=${APP_FRONTEND_BASE_URL}

# Encrypts stored per-company SMTP passwords (AES-256-GCM). NOTE: this key cannot be rotated freely —
# changing it invalidates every previously encrypted value, so set the real one before the first tenant
# configures email.
app.encryption.key=${APP_ENCRYPTION_KEY}

# HMAC key used to verify Mailgun inbound-reply webhooks. With a guessable value anyone can forge an
# inbound reply into any tenant, so this must be the real signing key from the Mailgun dashboard.
app.mailgun.webhook-signing-key=${APP_MAILGUN_WEBHOOK_SIGNING_KEY}

# Internet-facing origin of THIS API. Embedded as the tracking-pixel src in outgoing mail, so a
# recipient's mail client has to be able to reach it — a localhost value silently disables open tracking.
app.public-base-url=${APP_PUBLIC_BASE_URL}

# Inbound-mail subdomain whose MX points at Mailgun; used to build Reply-To (reply+{token}@<domain>).
# A placeholder value makes every reply undeliverable.
app.mail.inbound-domain=${APP_MAIL_INBOUND_DOMAIN}

# Behind Render's proxy the client IP arrives in X-Forwarded-For. Without this, every request looks like
# it comes from the proxy and the per-IP login rate limit would bucket all users together.
server.forward-headers-strategy=framework
