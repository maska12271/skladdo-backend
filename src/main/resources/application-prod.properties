# Production profile (activated by SPRING_PROFILES_ACTIVE=prod, which the Docker image sets by default).
# Every value below is supplied via environment variables on the host (Render) — no secrets live in this file.

# Postgres datasource. Render exposes host/port/db/user/password for its managed Postgres;
# compose SPRING_DATASOURCE_URL as jdbc:postgresql://HOST:PORT/DBNAME.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Keep schema auto-managed for now (same as local). Move to migrations before real production data.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# No H2 console in a Postgres deployment.
spring.h2.console.enabled=false

# Bind to the port the platform assigns (Render sets $PORT); fall back to 8080 elsewhere.
server.port=${PORT:8080}

# Secrets / deploy-specific config — must be provided by the environment.
app.jwt.secret=${APP_JWT_SECRET}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}
app.upload.dir=${APP_UPLOAD_DIR:./uploads}
