# Estonian error messages. Keep in parity with messages.properties.
# Apostrophes in argument-bearing messages ({0}...) must be doubled ('').

# --- Generic HTTP-status / handler fallbacks ---
error.notFound=Otsitavat kirjet ei leitud. See võib olla kustutatud või teisaldatud — värskendage lehte ja proovige uuesti.
error.accessDenied=Teil pole õigust seda toimingut teha. Kui vajate juurdepääsu, võtke ühendust administraatoriga.
error.badRequest.generic=Teie päringut ei õnnestunud töödelda. Kontrollige sisestatud andmeid ja proovige uuesti.
error.server=Meie poolel tekkis viga. Proovige hetke pärast uuesti — kui probleem püsib, võtke ühendust toega.
error.validation.fallback=Osa sisestatud andmetest on vigased. Kontrollige sisestust ja proovige uuesti.
error.badRequest.malformed=Päringut ei õnnestunud lugeda. Kontrollige sisestatud andmeid ja proovige uuesti.
# {0} = tundmatu välja nimi, mille järgi sortida sooviti.
error.badRequest.sortField=Välja "{0}" järgi ei saa sortida. Valige mõni teine veerg.
# {0} = puuduva kohustusliku parameetri nimi.
error.badRequest.missingParam=Päringust puudub kohustuslik väärtus ("{0}"). Proovige uuesti.
error.validation.tooLong=Üks sisestatud väärtustest on liiga pikk. Lühendage seda ja proovige uuesti.
error.validation.required=Nõutav väärtus puudub. Täitke kõik kohustuslikud väljad ja proovige uuesti.

# --- Authentication ---
error.auth.invalidCredentials=Sisestatud e-post või parool on vale. Kontrollige neid ja proovige uuesti.
error.auth.noAccount=Selle e-posti aadressiga kontot pole registreeritud.
error.auth.wrongPassword=Sisestatud parool on vale. Palun proovige uuesti.
error.auth.passwordSetupPending=Teie konto pole veel aktiivne. Vaadake oma e-posti, kust leiate parooli määramise lingi, ja seejärel logige sisse.
error.auth.companySuspended=Teie ettevõtte konto on peatatud. Palun võtke ühendust klienditoega.
# {0} = jäänud täisminutid. Eesti keeles on arvu järel alati partitiiv ("1 minuti", "5 minuti"), nii et valikuvormi pole vaja.
error.auth.tooManyAttempts=Liiga palju ebaõnnestunud katseid. Proovige uuesti {0} minuti pärast.

# --- Registreerimine ---
error.register.emailTaken=Selle e-postiga konto on juba olemas. Proovi hoopis sisse logida.
error.register.invalidAccountType=Vali, kas tegemist on ettevõtte- või laokontoga.

# --- Password reset ---
error.password.tokenInvalid=See paroolilink on vigane või aegunud. Küsige uus link ja proovige uuesti.

# --- Data integrity (409 conflict) ---
error.conflict.foreignKey=Seda kirjet kasutavad veel teised andmed ja seda ei saa kustutada. Eemaldage või siduge esmalt sellele viitavad kirjed.
error.conflict.unique=Sama unikaalse väärtusega (nt nimi, kood või number) kirje on juba olemas. Kasutage teist väärtust.
error.conflict.generic=See toiming läheb vastuollu olemasolevate andmetega ja seda ei õnnestunud lõpule viia.

# --- Bean validation (constraint codes) ---
NotBlank=See väli on kohustuslik.
NotNull=See väli on kohustuslik.
NotEmpty=See väli on kohustuslik.
Size=Väärtuse pikkus peab olema vahemikus {2} kuni {1} märki.
Min=Väärtus peab olema vähemalt {1}.
Max=Väärtus tohib olla kõige rohkem {1}.
Email=Sisestage kehtiv e-posti aadress.
Size.password=Parool peab olema vähemalt 8 märki pikk.

# --- Shared business rules ---
error.quantityPositive=Kogus peab olema suurem kui 0.
# {0} = tellimuse rea id, mille klient saatis.
error.order.unknownLine=See tellimuse rida ({0}) ei kuulu selle tellimuse juurde. Värskendage lehte ja proovige uuesti.

# --- Inventory ---
error.inventory.quantityChangeNonZero=Laoseisu muutmiseks sisestage nullist erinev kogus.
error.inventory.lotNumberRequired=Partii number on kohustuslik.
error.inventory.lotNotInProduct=See partii ei kuulu selle toote juurde.
error.inventory.lotRemoveExceeds=Ei saa eemaldada rohkem, kui partiis ''{0}'' on (praegu {1}).
error.inventory.noAdjustment=Sisestage vähemalt ühele partiile nullist erinev muudatus.
error.inventory.lotExists=Partii numbriga ''{0}'' on selles laos juba olemas. Kasutage teist partii numbrit.

# --- Invoice ---
error.invoice.cancelledOrder=Tühistatud tellimusele ei saa arvet koostada. Avage tellimus esmalt uuesti.
error.invoice.activePrepaymentExists=Sellel tellimusel on juba aktiivne ettemaksuarve. Enne uue koostamist tühistage see.
error.invoice.activeInvoiceExists=Sellel tellimusel on juba aktiivne arve. Enne uue koostamist tühistage see.
error.invoice.prepaymentUnsettled=Ettemaksuarve {0} peab olema tasutud või tühistatud enne lõpparve koostamist.
error.invoice.prepaymentNoValue=Väärtuseta tellimusele ei saa ettemaksuarvet koostada. Lisage esmalt read või summa.
error.invoice.prepaymentRange=Ettemaks peab olema suurem kui null ja mitte suurem kui tellimuse kogusumma.
error.invoice.voidedNoStatusChange=Tühistatud arve makseolekut ei saa muuta.
error.invoice.useVoidEndpoint=Arve tühistamiseks kasutage tühistamise toimingut.
error.invoice.prepaymentAppliedToFinal=See ettemaks on rakendatud lõpparvele. Tühistage esmalt lõpparve.

# --- Stock transfer ---
error.transfer.quantityPositive=Ülekantav kogus peab olema suurem kui 0.
error.transfer.warehousesRequired=Nõutud on nii lähte- kui ka sihtladu.
error.transfer.warehousesDifferent=Lähte- ja sihtladu peavad olema erinevad.
error.transfer.lotNotInSource=See partii ei asu lähtelaos.
error.transfer.lotExceeds=Ei saa üle kanda rohkem, kui partiis ''{0}'' on (praegu {1}).

# --- Warehouse ---
error.warehouse.insufficientStock=Laos ''{0}'' ei ole toote ''{1}'' jaoks piisavalt laoseisu (on {2}, vaja {3}).
error.warehouse.noAccess=Teil pole sellele laole juurdepääsu. Kui vajate seda, võtke ühendust administraatoriga.

# --- Laopartnerid ------------------------------------------------------------------------------
error.partner.unknownCode=Sellist ühenduskoodi ei leitud. Kontrollige seda ja proovige uuesti.
error.partner.ownCompany=See kood kuulub teie enda ettevõttele.
error.partner.alreadyConnected=Olete selle ettevõttega juba ühendatud.
error.partner.notActive=See ühendus ei ole aktiivne.
error.partner.clientOnly=Seda saab muuta ainult ettevõte, kellele andmed kuuluvad.
error.partner.noAccess=Teil pole sellele ettevõttele juurdepääsu. Ühendus võib olla lõpetatud.
error.partner.codeGenerationFailed=Ühenduskoodi loomine ebaõnnestus. Palun proovige uuesti.
error.partner.codeExpired=See ühenduskood on aegunud. Paluge neil saata uus.
error.partner.codeUsed=See ühenduskood on juba kasutatud. Paluge neil saata uus.
error.partner.businessOnly=Laopartnerit saab kutsuda ainult ettevõtte konto.
error.partner.warehouseOnly=Ettevõttega saab ühenduda ainult lao konto.

# --- User ---
error.user.ownerCannotCreate=Omaniku kontosid ei saa kasutajahalduse kaudu luua.
error.user.emailExists=Selle e-postiga konto on juba olemas. Kasutage teist e-posti aadressi.
error.company.registrationCodeExists=See registrikood on juba teisel ettevõttel kasutusel.
error.admin.cannotSuspendOperator=Selles ettevõttes on platvormi haldaja konto, seega ei saa seda peatada.
error.user.ownerCannotModify=Omaniku kontot ei saa muuta.
error.user.cannotPromoteOwner=Kasutajat ei saa omanikuks ülendada.
error.user.passwordTooShort=Parool peab olema vähemalt 8 märki pikk.
error.user.ownerCannotDelete=Omaniku kontot ei saa kustutada.
error.user.permissionsRestrictedRoles=Õigusi saab määrata ainult tava- ja laokasutaja kontodele.
error.user.ownerCannotArchive=Omaniku kontot ei saa arhiveerida.
error.user.cannotDeleteSelf=Te ei saa oma kontot kustutada.
error.user.cannotArchiveSelf=Te ei saa oma kontot arhiveerida.
error.user.cannotUnarchiveSelf=Te ei saa oma kontot arhiivist taastada.

# --- Tender ---
error.tender.participantMismatch=See osaleja ei kuulu selle hanke juurde.
error.tender.partMismatch=See osa ei kuulu selle hanke juurde.
error.tender.requirementMismatch=See nõue ei kuulu selle osa juurde.
error.tender.lastPart=Hankel peab olema vähemalt üks osa.
error.tender.ownCompanyUndeletable=Teie enda ettevõtet ei saa osast eemaldada.

# --- File upload ---
error.upload.noFile=Palun valige üleslaadimiseks fail.
error.upload.imageOnly=Siia saab üles laadida ainult pildifaile.
error.upload.unsupportedType=Toetamata failitüüp. Laadige üles PDF, pilt või kontoridokument.

# --- Email -------------------------------------------------------------------------------------
error.email.smtpNotConfigured=E-kirjade saatmine pole veel seadistatud. Palun laske administraatoril SMTP-seaded esmalt seadistada.
error.email.testRecipientRequired=Sisestage testkirja saaja aadress.
error.email.templateNotFound=Seda e-kirja malli ei leitud.

# Parooli määramise/lähtestamise e-kiri (saadetakse kasutajale, tõlgitud kasutaja keelde).
email.passwordReset.subject=Määrake oma Skladdo parool
email.passwordReset.greeting=Tere, {0}!
email.passwordReset.body=Parooli määramiseks ja Skladdo kontole juurdepääsuks kasutage allolevat nuppu.
email.passwordReset.cta=Määra parool
email.passwordReset.expiry=See link aegub {0} tunni pärast.
email.passwordReset.ignore=Kui te seda e-kirja ei oodanud, võite selle rahulikult eirata.

# --- Paketi / tellimuse piirangud --------------------------------------------------------------
error.plan.userLimit=Teie pakett lubab kuni {0} kasutajakontot. Rohkemate lisamiseks uuendage paketti.
# {0} = valitud paketi kohtade arv, {1} = praegu kasutusel.
error.plan.downgradeSeats=See pakett lubab kuni {0} kasutajakontot, teil on kasutusel {1}. Arhiveerige või eemaldage üleliigsed kontod ja seejärel vahetage paketti.
error.plan.manufacturerLimit=Teie pakett lubab kuni {0} tootjat. Rohkemate lisamiseks uuendage paketti.
error.plan.productLimit=Teie pakett lubab kuni {0} toodet. Rohkemate lisamiseks uuendage paketti.
error.plan.tendersLocked=Hanked on lisafunktsioon. Selle kasutamiseks lülitage see sisse seadetes Pakett ja arveldus.
error.plan.emailsLocked=Tootjate e-kirjad on lisafunktsioon. Selle kasutamiseks lülitage see sisse seadetes Pakett ja arveldus.
error.plan.invalidPlan=Tundmatu pakett. Valige üks saadaolevatest pakettidest.
error.invite.invalidTerms=Need kutselingi tingimused ei ole sobivad. Kontrollige konto tüüpi ja paketti.
error.invite.notUsable=See kutselink ei kehti enam. Paluge uus link.
error.plan.invalidAddon=Tundmatu lisafunktsioon. Valige üks saadaolevatest lisafunktsioonidest.
