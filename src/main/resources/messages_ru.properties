# Russian error messages. Keep in parity with messages.properties.
# Apostrophes in argument-bearing messages ({0}...) must be doubled ('').

# --- Generic HTTP-status / handler fallbacks ---
error.notFound=Запрашиваемая запись не найдена. Возможно, она была удалена или перемещена — обновите страницу и попробуйте снова.
error.accessDenied=У вас нет прав на выполнение этого действия. Обратитесь к администратору, если вам нужен доступ.
error.badRequest.generic=Не удалось обработать запрос. Проверьте введённые данные и попробуйте снова.
error.server=Произошла ошибка на нашей стороне. Повторите попытку через некоторое время — если проблема сохраняется, обратитесь в поддержку.
error.validation.fallback=Часть введённых данных некорректна. Проверьте введённые данные и попробуйте снова.

# --- Authentication ---
error.auth.invalidCredentials=Неверный адрес электронной почты или пароль. Проверьте их и попробуйте снова.

# --- Data integrity (409 conflict) ---
error.conflict.foreignKey=Эта запись всё ещё используется другими данными и не может быть удалена. Сначала удалите или переназначьте связанные с ней записи.
error.conflict.unique=Запись с таким же уникальным значением (например, названием, кодом или номером) уже существует. Используйте другое значение.
error.conflict.generic=Действие конфликтует с существующими данными и не может быть выполнено.

# --- Bean validation (constraint codes) ---
NotBlank=Это поле обязательно для заполнения.
NotNull=Это поле обязательно для заполнения.
NotEmpty=Это поле обязательно для заполнения.
Size=Длина значения должна быть от {2} до {1} символов.
Min=Значение должно быть не меньше {1}.
Max=Значение должно быть не больше {1}.
Email=Введите корректный адрес электронной почты.
Size.password=Пароль должен содержать не менее 6 символов.

# --- Shared business rules ---
error.quantityPositive=Количество должно быть больше 0.

# --- Inventory ---
error.inventory.quantityChangeNonZero=Введите ненулевое значение для изменения остатка.
error.inventory.lotNumberRequired=Номер партии обязателен.
error.inventory.lotNotInProduct=Эта партия не относится к данному товару.
error.inventory.lotRemoveExceeds=Нельзя списать больше, чем есть в партии ''{0}'' (сейчас {1}).
error.inventory.noAdjustment=Введите ненулевое изменение хотя бы для одной партии.
error.inventory.lotExists=Партия с номером ''{0}'' уже существует на этом складе. Используйте другой номер партии.

# --- Invoice ---
error.invoice.cancelledOrder=Нельзя выставить счёт по отменённому заказу. Сначала откройте заказ заново.
error.invoice.activePrepaymentExists=По этому заказу уже есть активный счёт на предоплату. Аннулируйте его перед созданием нового.
error.invoice.activeInvoiceExists=По этому заказу уже есть активный счёт. Аннулируйте его перед созданием нового.
error.invoice.prepaymentUnsettled=Счёт на предоплату {0} должен быть оплачен или аннулирован до создания итогового счёта.
error.invoice.prepaymentNoValue=Нельзя создать счёт на предоплату для заказа без суммы. Сначала добавьте позиции или сумму.
error.invoice.prepaymentRange=Предоплата должна быть больше нуля и не превышать сумму заказа.
error.invoice.voidedNoStatusChange=У аннулированного счёта нельзя изменить статус оплаты.
error.invoice.useVoidEndpoint=Для аннулирования счёта используйте действие аннулирования.
error.invoice.prepaymentAppliedToFinal=Эта предоплата применена к итоговому счёту. Сначала аннулируйте итоговый счёт.

# --- Stock transfer ---
error.transfer.quantityPositive=Количество для перемещения должно быть больше 0.
error.transfer.warehousesRequired=Необходимо указать и склад-источник, и склад-получатель.
error.transfer.warehousesDifferent=Склад-источник и склад-получатель должны различаться.
error.transfer.lotNotInSource=Эта партия не хранится на складе-источнике.
error.transfer.lotExceeds=Нельзя переместить больше, чем есть в партии ''{0}'' (сейчас {1}).

# --- Warehouse ---
error.warehouse.insufficientStock=На складе ''{0}'' недостаточно остатка для товара ''{1}'' (есть {2}, нужно {3}).
error.warehouse.noAccess=У вас нет доступа к этому складу. Обратитесь к администратору, если он вам нужен.

# --- User ---
error.user.ownerCannotCreate=Учётные записи владельца нельзя создать через управление пользователями.
error.user.emailExists=Учётная запись с таким адресом электронной почты уже существует. Используйте другой адрес.
error.user.ownerCannotModify=Учётную запись владельца нельзя изменить.
error.user.cannotPromoteOwner=Пользователя нельзя повысить до владельца.
error.user.passwordTooShort=Пароль должен содержать не менее 6 символов.
error.user.ownerCannotDelete=Учётную запись владельца нельзя удалить.
error.user.permissionsRestrictedRoles=Права можно назначать только обычным и складским учётным записям.
error.user.ownerCannotArchive=Учётную запись владельца нельзя архивировать.
error.user.cannotDeleteSelf=Вы не можете удалить собственную учётную запись.
error.user.cannotArchiveSelf=Вы не можете архивировать собственную учётную запись.
error.user.cannotUnarchiveSelf=Вы не можете восстановить собственную учётную запись из архива.

# --- Tender ---
error.tender.participantMismatch=Этот участник не относится к данному тендеру.

# --- File upload ---
error.upload.noFile=Пожалуйста, выберите файл для загрузки.
error.upload.imageOnly=Сюда можно загружать только файлы изображений.
error.upload.unsupportedType=Неподдерживаемый тип файла. Загрузите PDF, изображение или офисный документ.
