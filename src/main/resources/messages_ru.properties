# --- Приглашения (компания приглашает коллегу) -------------------------------------------------
error.userInvite.notUsable=Эта ссылка-приглашение больше не действительна. Запросите новую.
error.userInvite.ownerCannotBeInvited=По приглашению нельзя создать владельца. Выберите другую роль.
error.userInvite.emailExists=Учётная запись с таким адресом уже существует.
error.userInvite.alreadyAccepted=Это приглашение уже использовано.

# --- Ограничения тарифа / подписки -------------------------------------------------------------
error.plan.userLimit=Ваш тариф допускает до {0} учётных записей. Чтобы добавить больше, обновите тариф.
# {0} = лимит выбранного тарифа, {1} = сколько занято сейчас.
error.plan.downgradeSeats=Этот тариф допускает до {0} учётных записей, а у вас занято {1}. Сначала архивируйте или удалите лишние учётные записи, затем меняйте тариф.
error.plan.tendersLocked=Тендеры — дополнительная функция. Включите её в разделе «Тариф и оплата», чтобы продолжить.
error.plan.emailsLocked=Письма производителям — дополнительная функция. Включите её в разделе «Тариф и оплата», чтобы продолжить.
error.plan.invalidPlan=Неизвестный тариф. Выберите один из доступных тарифов.
error.invite.invalidTerms=Эти условия пригласительной ссылки недопустимы. Проверьте тип аккаунта и тариф.
error.invite.notUsable=Эта пригласительная ссылка больше не действует. Запросите новую.
error.plan.invalidAddon=Неизвестная дополнительная функция. Выберите одну из доступных.
