spring.application.name=kladdo

spring.datasource.url=jdbc:h2:file:./data/tenderdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.sql.init.mode=never

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# i18n error messages resolved from the request Accept-Language header (en/et/ru).
# fallback-to-system-locale=false so an unknown/absent locale uses the English base bundle,
# not whatever locale the server JVM happens to run in.
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# JWT / auth configuration
app.jwt.secret=change-this-super-secret-signing-key-please-make-it-at-least-32-bytes-long-0123456789
app.jwt.expiration-ms=86400000

# Brute-force protection on the unauthenticated auth endpoints (login, forgot-password). Two counters run
# per attempt: one on the targeted email, which cannot be evaded by changing source address and is what
# actually protects a password, and a looser one on the client IP, which catches a single source spraying
# many accounts (looser because NAT makes offices and mobile networks share addresses).
# Counters live in memory, so a multi-instance deployment would give each instance its own - move them to
# a shared store before scaling out. Set enabled=false to turn throttling off in a test run.
app.auth.rate-limit.enabled=true
app.auth.rate-limit.max-attempts-per-account=5
app.auth.rate-limit.max-attempts-per-ip=20
app.auth.rate-limit.window-minutes=15
app.auth.rate-limit.lockout-minutes=15

# AES-256-GCM key for encrypting stored secrets (per-company SMTP passwords). The raw string is
# SHA-256 hashed to always yield a 32-byte key regardless of its length. Generate a real, random
# value for production; changing it invalidates every previously encrypted value. Dev-only default.
app.encryption.key=change-this-encryption-key-for-production-0123456789

# Platform-controlled inbound-mail domain used to build the Reply-To on every outgoing email
# (reply+{token}@<inbound-domain>). Never a tenant's own SMTP domain: inbound MX/webhook routing is
# configured once at the platform level. See Mailgun Routes / Inbound Parse setup (ops, not code).
app.mail.inbound-domain=inbound.kladdo.example

# Publicly reachable base URL of this API, used to build the absolute tracking-pixel image src embedded
# in outgoing emails. In production this must be the internet-facing HTTPS origin (a recipient's mail
# client loads it). Dev default points at localhost - pixel opens will only register for local testing.
app.public-base-url=http://localhost:8080

# Mailgun Inbound Parse webhook signing key (from the Mailgun dashboard). Platform-level, not
# per-tenant. Used to HMAC-verify inbound reply webhooks before trusting their payload. Dev placeholder.
app.mailgun.webhook-signing-key=change-this-mailgun-webhook-signing-key

# Public base URL of the FRONTEND (the SPA), used to build password setup/reset links a user clicks in
# their email: {frontend-base-url}/reset-password?token=... In dev the frontend runs on Vite's port
# (5173), distinct from the API's app.public-base-url (8080). In production set this to the deployed
# site origin. The reset link points at the SPA, which then calls the API.
app.frontend-base-url=http://localhost:5173

# How long a password setup/reset link stays valid, in hours. A fresh link supersedes any earlier one.
app.password-reset.expiry-hours=72

# Seed accounts created on first startup (when no users exist yet)
app.seed.enabled=true

# Background jobs (billing-period rollover, exchange-rate warm-up, notification producers). Set to false
# to boot without them, e.g. in tests or a one-off CLI run. See SchedulingConfig / ScheduledMaintenanceService.
app.scheduling.enabled=true

# When the notification producers run. Defaults are early-morning so alerts are waiting at the start of the
# day; override to re-time them for a deployment's timezone (or to trigger them on demand while testing).
app.jobs.overdue-invoices-cron=0 0 7 * * *
app.jobs.tender-deadlines-cron=0 5 7 * * *
app.jobs.low-stock-cron=0 10 7 * * *

app.upload.dir=./uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Multi-currency. base-default is the currency a brand-new company's settings start in; supported is the
# subset of known currencies offered in this deployment (empty/absent = offer all). Unknown codes are
# ignored. Per-company base currency lives in CompanySettings.currency; rates are managed per company.
app.currency.base-default=EUR
app.currency.supported=EUR,USD,GBP,CHF,SEK,NOK,DKK,PLN,CZK,CAD,AUD,JPY